name: Daily Images Without KSU

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avdlite-daily-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check source files
        run: |
          python3 -m avdlite.privacy
          python3 -m unittest discover -s tests -v
      - name: Restore published image SHA-1 records
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/state.json
          key: image-sha1-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: image-sha1-v1-
      - name: Enumerate stable APIs and available page sizes
        id: plan
        run: python3 -m avdlite.ci plan --cache "$RUNNER_TEMP/image-cache/state.json"

  tools:
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.value }}
      packages: ${{ steps.resolve.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve current stable SDK package identities
        id: resolve
        run: python3 -m avdlite.tools resolve
      - name: Identify shared SDK and AVB cache
        id: key
        env:
          CACHE_KEY: tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.key }}-${{ hashFiles('resources/tools.json') }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"
      - name: Check shared tools cache without downloading it
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/android-sdk
            ${{ runner.temp }}/avdlite/tools
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Install shared SDK on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk"
          cp -r "$ANDROID_HOME/licenses" "$RUNNER_TEMP/android-sdk/licenses"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/android-sdk" --channel=0 "build-tools;35.0.0" "platforms;android-35" "platform-tools" "emulator"
      - name: Verify SDK revisions and AVB checksums before caching
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SDK_PACKAGES: ${{ steps.resolve.outputs.packages }}
        run: python3 -m avdlite.tools verify --sdk "$RUNNER_TEMP/android-sdk" --work "$RUNNER_TEMP/avdlite"
      - name: Save shared SDK and verified AVB tools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/android-sdk
            ${{ runner.temp }}/avdlite/tools
          key: ${{ steps.key.outputs.value }}

  images:
    needs: [plan, tools]
    name: API ${{ matrix.image.api }} (${{ matrix.image.page_size }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE_JSON: ${{ toJSON(matrix.image) }}
      CACHED_JSON: ${{ toJSON(matrix.cached) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reuse release image when its source SHA-1 is unchanged
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m avdlite.ci prepare --work "$RUNNER_TEMP/avdlite"
      - name: Download changed source image
        if: steps.prepare.outputs.reused != 'true'
        run: python3 -m avdlite.sources download --manifest "$RUNNER_TEMP/avdlite/manifest.json" --cache "$RUNNER_TEMP/cache"
      - name: Restore shared SDK and AVB tools
        if: steps.prepare.outputs.reused != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/android-sdk
            ${{ runner.temp }}/avdlite/tools
          key: ${{ needs.tools.outputs.key }}
          fail-on-cache-miss: true
      - name: Verify restored SDK and AVB tools
        if: steps.prepare.outputs.reused != 'true'
        env:
          SDK_PACKAGES: ${{ needs.tools.outputs.packages }}
        run: |
          python3 -m avdlite.tools verify --sdk "$RUNNER_TEMP/android-sdk" --work "$RUNNER_TEMP/avdlite"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
      - name: Install host build and emulator libraries
        if: steps.prepare.outputs.reused != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs gdisk zerofree lz4 cpio unzip libpulse0 libnss3 libxkbcommon0
          sudo chmod a+rw /dev/kvm
          df -h "$RUNNER_TEMP"
      - name: Inspect image partitions
        if: steps.prepare.outputs.reused != 'true'
        run: python3 -m avdlite.preflight --archive "$RUNNER_TEMP/cache/image/source.zip" --work "$RUNNER_TEMP/avdlite"
      - name: Debloat and build image without KSU
        if: steps.prepare.outputs.reused != 'true'
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m avdlite.build --manifest "$RUNNER_TEMP/avdlite/manifest.json" --cache "$RUNNER_TEMP/cache" --work "$RUNNER_TEMP/avdlite" --sdk "$ANDROID_HOME"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/avdlite"
      - name: Verify cold boot and reboot
        if: steps.prepare.outputs.reused != 'true'
        run: python3 -m avdlite.smoke --manifest "$RUNNER_TEMP/avdlite/manifest.json" --work "$RUNNER_TEMP/avdlite" --sdk "$ANDROID_HOME"
      - name: Package verified image
        if: steps.prepare.outputs.reused != 'true'
        run: python3 -m avdlite.package --work "$RUNNER_TEMP/avdlite"
      - name: Record image identity and SHA-256
        run: python3 -m avdlite.ci record --work "$RUNNER_TEMP/avdlite"
      - name: Upload changed image assets and all source SHA-1 records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image.api }}-${{ matrix.image.page_size }}
          path: ${{ runner.temp }}/avdlite/artifact/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload build verification evidence
        if: always() && steps.prepare.outputs.reused == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.image.api }}-${{ matrix.image.page_size }}
          path: |
            ${{ runner.temp }}/avdlite/manifest.json
            ${{ runner.temp }}/avdlite/preflight.json
            ${{ runner.temp }}/avdlite/build-report.json
            ${{ runner.temp }}/avdlite/verification.json
            ${{ runner.temp }}/avdlite/evidence/
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [plan, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/publish
          merge-multiple: true
      - name: Update fixed release assets and description
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: python3 -m avdlite.ci publish --work "$RUNNER_TEMP/publish" --cache "$RUNNER_TEMP/image-cache/state.json"
      - name: Cache successfully published image SHA-1 records
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache/state.json
          key: image-sha1-v1-${{ github.run_id }}-${{ github.run_attempt }}
